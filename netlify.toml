# Netlify Deployment Configuration for SIH26128 Smart Animal Health Platform
[build]
  command = "python build_static.py"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.10"

# Ensure fresh assets on deployments
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Direct clean URL rewrites for application pages
[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/register-animal"
  to = "/register-animal.html"
  status = 200

[[redirects]]
  from = "/manual-assessment"
  to = "/manual-assessment.html"
  status = 200

[[redirects]]
  from = "/iot-monitor"
  to = "/iot-monitor.html"
  status = 200

[[redirects]]
  from = "/photo-screening"
  to = "/photo-screening.html"
  status = 200

[[redirects]]
  from = "/emergency-vet"
  to = "/emergency-vet.html"
  status = 200

[[redirects]]
  from = "/alerts"
  to = "/alerts.html"
  status = 200

[[redirects]]
  from = "/vaccinations"
  to = "/vaccinations.html"
  status = 200

[[redirects]]
  from = "/helpline-admin"
  to = "/helpline-admin.html"
  status = 200

[[redirects]]
  from = "/disease-library"
  to = "/disease-library.html"
  status = 200

[[redirects]]
  from = "/care-plans"
  to = "/care-plans.html"
  status = 200

# Catch-all fallback for client-side single page navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
